services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: puntofactura
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PF_POSTGRES_PASSWORD:?Configura PF_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - puntofactura_node_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d puntofactura"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  puntofactura_node_data:
    name: puntofactura_puntofactura_node_data
    external: true
